<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>C. elegans 3D Body Model Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #ddd; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
#canvas3d { width: 100vw; height: 100vh; display: block; }
#hud {
  position: absolute; top: 12px; left: 12px;
  background: rgba(10,10,20,0.85); border: 1px solid #333;
  border-radius: 8px; padding: 14px 18px; min-width: 260px;
  font-size: 13px; line-height: 1.6;
}
#hud h2 { font-size: 16px; color: #6cf; margin-bottom: 6px; }
#hud .val { color: #8f8; font-weight: bold; }
#controls {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(10,10,20,0.85); border: 1px solid #333;
  border-radius: 8px; padding: 10px 20px; display: flex; gap: 12px; align-items: center;
}
#controls button {
  background: #234; border: 1px solid #567; color: #8cf;
  padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px;
}
#controls button:hover { background: #345; }
#controls input[type=range] { width: 150px; }
#controls label { font-size: 12px; color: #aaa; }
#legend {
  position: absolute; top: 12px; right: 12px;
  background: rgba(10,10,20,0.85); border: 1px solid #333;
  border-radius: 8px; padding: 12px 16px; font-size: 12px;
}
#legend h3 { color: #fc6; margin-bottom: 4px; font-size: 14px; }
.muscle-bar {
  height: 12px; border-radius: 2px; margin: 2px 0;
  background: linear-gradient(90deg, #060, #0f0, #ff0, #f00);
}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>

<div id="hud">
  <h2>C. elegans 3D Body Model</h2>
  <div>Nodes: <span class="val" id="hud-nodes">49</span> | Muscles: <span class="val" id="hud-muscles">95</span></div>
  <div>Time: <span class="val" id="hud-time">0.00</span>s</div>
  <div>Frame: <span class="val" id="hud-frame">0</span> / <span id="hud-total">0</span></div>
  <div>Speed: <span class="val" id="hud-speed">0.00</span> mm/s</div>
  <div style="margin-top:6px;font-size:11px;color:#888;">
    Boyle 2012 + Padmanabhan 2012<br>
    Curvature-driven | RFT drag (K=40)
  </div>
</div>

<div id="legend">
  <h3>DV Curvature</h3>
  <div class="muscle-bar"></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;">
    <span style="color:#0a0;">-5/mm</span>
    <span style="color:#ff0;">0</span>
    <span style="color:#f00;">+5/mm</span>
  </div>
  <div style="margin-top:8px;font-size:11px;color:#aaa;">
    Drag to rotate | Scroll to zoom<br>
    Right-drag to pan
  </div>
</div>

<div id="controls">
  <button id="btn-play">&#9654; Play</button>
  <button id="btn-reset">&#8634; Reset</button>
  <label>Speed: <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1"></label>
  <label>Scale: <input type="range" id="scale-slider" min="1" max="50" step="1" value="20"></label>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Setup ---
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.Fog(0x0a0a14, 30, 80);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 8, 12);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// --- Lights ---
const ambient = new THREE.AmbientLight(0x334455, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x4466aa, 0.4);
backLight.position.set(-5, 3, -5);
scene.add(backLight);

// --- Ground plane ---
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a2e, roughness: 0.9, metalness: 0.1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(40, 40, 0x222244, 0x181830);
scene.add(grid);

// --- Worm body ---
let animData = null;
let currentFrame = 0;
let playing = false;
let playSpeed = 1.0;
let bodyScale = 20.0;  // scale factor (mm -> scene units)

const wormGroup = new THREE.Group();
scene.add(wormGroup);

// Tube segments for body
const tubeMeshes = [];
const TUBE_RADIAL_SEGMENTS = 8;

function curvatureToColor(curv) {
  // -5..+5 -> green..yellow..red
  const t = Math.max(-1, Math.min(1, curv / 5.0));
  if (t < 0) {
    return new THREE.Color(0, 0.6 - t * 0.4, 0);  // green
  } else {
    return new THREE.Color(t, 0.6 * (1 - t), 0);  // yellow -> red
  }
}

function buildWormMesh(frame, radii) {
  // Clear old
  wormGroup.clear();
  tubeMeshes.length = 0;

  const nodes = frame.nodes;
  const curvs = frame.curv;
  const n = nodes.length;

  // Build tube using CatmullRomCurve3
  const points = nodes.map(p => new THREE.Vector3(
    (p[0] - nodes[0][0]) * bodyScale,
    p[2] * bodyScale,
    (p[1] - nodes[0][1]) * bodyScale
  ));

  // Create individual tube segments with curvature coloring
  for (let i = 0; i < n - 1; i++) {
    const p0 = points[i];
    const p1 = points[i + 1];
    const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(p1, p0);
    const len = dir.length();
    dir.normalize();

    const r = (radii[i] + radii[i + 1]) * 0.5 * bodyScale * 2.5;  // exaggerate radius for visibility
    const geo = new THREE.CylinderGeometry(r, r, len, TUBE_RADIAL_SEGMENTS, 1, false);
    const color = curvatureToColor(curvs[i]);

    const mat = new THREE.MeshStandardMaterial({
      color: color, roughness: 0.4, metalness: 0.15,
      emissive: color.clone().multiplyScalar(0.15)
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;

    // Orient cylinder along segment direction
    const quat = new THREE.Quaternion();
    quat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    mesh.quaternion.copy(quat);
    mesh.position.copy(mid);

    wormGroup.add(mesh);
    tubeMeshes.push({ mesh, mat });
  }

  // Head marker (sphere)
  const headR = radii[0] * bodyScale * 3;
  const headGeo = new THREE.SphereGeometry(headR, 12, 8);
  const headMat = new THREE.MeshStandardMaterial({ color: 0x44ff44, emissive: 0x114411 });
  const headMesh = new THREE.Mesh(headGeo, headMat);
  headMesh.position.copy(points[0]);
  wormGroup.add(headMesh);

  // Tail marker
  const tailR = radii[n - 1] * bodyScale * 2.5;
  const tailGeo = new THREE.SphereGeometry(tailR, 8, 6);
  const tailMat = new THREE.MeshStandardMaterial({ color: 0x6666ff, emissive: 0x111133 });
  const tailMesh = new THREE.Mesh(tailGeo, tailMat);
  tailMesh.position.copy(points[n - 1]);
  wormGroup.add(tailMesh);
}

function updateWormMesh(frame, radii) {
  const nodes = frame.nodes;
  const curvs = frame.curv;
  const n = nodes.length;

  const points = nodes.map(p => new THREE.Vector3(
    (p[0] - nodes[0][0]) * bodyScale,
    p[2] * bodyScale,
    (p[1] - nodes[0][1]) * bodyScale
  ));

  for (let i = 0; i < n - 1 && i < tubeMeshes.length; i++) {
    const p0 = points[i];
    const p1 = points[i + 1];
    const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(p1, p0);
    dir.normalize();

    const { mesh, mat } = tubeMeshes[i];
    const quat = new THREE.Quaternion();
    quat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    mesh.quaternion.copy(quat);
    mesh.position.copy(mid);

    const color = curvatureToColor(curvs[i]);
    mat.color.copy(color);
    mat.emissive.copy(color.clone().multiplyScalar(0.15));
  }

  // Update head/tail
  const children = wormGroup.children;
  if (children.length >= n + 1) {
    children[n - 1].position.copy(points[0]);  // head sphere
    children[n].position.copy(points[n - 1]);   // tail sphere
  }
}

// --- Load data ---
async function loadData() {
  try {
    const resp = await fetch('worm3d_anim.json');
    animData = await resp.json();
    document.getElementById('hud-nodes').textContent = animData.num_nodes;
    document.getElementById('hud-muscles').textContent = animData.num_muscles;
    document.getElementById('hud-total').textContent = animData.frames.length;

    if (animData.frames.length > 0) {
      buildWormMesh(animData.frames[0], animData.radii);
    }
    console.log(`Loaded ${animData.frames.length} frames`);
  } catch (e) {
    console.error('Failed to load worm3d_anim.json:', e);
    document.getElementById('hud-time').textContent = 'ERROR: place worm3d_anim.json next to this HTML';
  }
}

// --- Animation loop ---
let lastTime = 0;
let accumTime = 0;
const FRAME_DT = 0.05;  // 50ms per frame

function animate(timestamp) {
  requestAnimationFrame(animate);

  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  if (playing && animData && animData.frames.length > 1) {
    accumTime += dt * playSpeed;
    while (accumTime >= FRAME_DT) {
      accumTime -= FRAME_DT;
      currentFrame++;
      if (currentFrame >= animData.frames.length) {
        currentFrame = 0;
      }
    }
    updateWormMesh(animData.frames[currentFrame], animData.radii);

    const frame = animData.frames[currentFrame];
    document.getElementById('hud-time').textContent = frame.t.toFixed(2);
    document.getElementById('hud-frame').textContent = currentFrame;

    // Compute speed from position change
    if (currentFrame > 0) {
      const prev = animData.frames[currentFrame - 1];
      const dx = frame.nodes[0][0] - prev.nodes[0][0];
      const dy = frame.nodes[0][1] - prev.nodes[0][1];
      const dz = frame.nodes[0][2] - prev.nodes[0][2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      const speed = dist / FRAME_DT;
      document.getElementById('hud-speed').textContent = speed.toFixed(3);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

// --- Controls ---
document.getElementById('btn-play').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btn-play').innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  currentFrame = 0;
  accumTime = 0;
  if (animData && animData.frames.length > 0) {
    buildWormMesh(animData.frames[0], animData.radii);
    document.getElementById('hud-time').textContent = '0.00';
    document.getElementById('hud-frame').textContent = '0';
  }
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  playSpeed = parseFloat(e.target.value);
});

document.getElementById('scale-slider').addEventListener('input', (e) => {
  bodyScale = parseFloat(e.target.value);
  if (animData && animData.frames.length > 0) {
    buildWormMesh(animData.frames[currentFrame], animData.radii);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Start ---
loadData();
requestAnimationFrame(animate);
</script>
</body>
</html>
